[package]
name = "keyring-node"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = "0.8.19"
alloy-signer = "0.9.2"
alloy-signer-local = { version = "0.9.2", features = ["keystore"] }
async-std = "1.12"
anyhow = "1.0.95"
borsh = { version = "1.5.5", features = ["borsh-derive"] }
borsh-derive = "1.5.5"
cggmp21 = { version = "0.6.0", features = ["curve-secp256k1"] }
futures = "0.3.31"
hex = "0.4.3"
hyper = "1.5.2"
jsonrpsee = { version = "0.24.7", features = ["server", "http-client", "ws-client", "macros", "client-ws-transport-tls"] }
k256 = "0.13.4"
lazy_static = "1.5.0"
libp2p = { version = "0.53", features = ["full"] }
rand = "0.8.5"
rand_core = "0.6.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.2", features = ["timeout"] }
tower-http = { version = "0.6.2", features = ["cors", "compression-full", "sensitive-headers", "trace", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
bincode = "1.3.3"
